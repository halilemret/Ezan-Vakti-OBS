<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>Ezan Vakitleri — Canlı</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: rgba(10, 28, 18, 0.92);
            --card-bg: rgba(20, 50, 35, 0.85);
            --card-active: rgba(212, 168, 67, 0.25);
            --gold: #d4a843;
            --gold-light: #f0d78c;
            --green-light: #7ec8a0;
            --text: #e8e0d0;
            --text-dim: rgba(232, 224, 208, 0.5);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: transparent;
            color: var(--text);
            overflow: hidden;
        }

        .widget {
            width: 540px;
            padding: 20px 18px 12px;
            background: var(--bg-dark);
            border-radius: 18px;
            border: 1px solid rgba(212, 168, 67, 0.2);
            position: relative;
            overflow: hidden;
        }

        /* ── Decorative BG ── */
        .widget::before {
            content: '';
            position: absolute;
            top: -60px;
            right: -60px;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(212, 168, 67, 0.08) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .geo-pattern {
            position: absolute;
            inset: 0;
            opacity: 0.03;
            background-image:
                linear-gradient(30deg, var(--gold) 12%, transparent 12.5%, transparent 87%, var(--gold) 87.5%),
                linear-gradient(150deg, var(--gold) 12%, transparent 12.5%, transparent 87%, var(--gold) 87.5%),
                linear-gradient(30deg, var(--gold) 12%, transparent 12.5%, transparent 87%, var(--gold) 87.5%),
                linear-gradient(150deg, var(--gold) 12%, transparent 12.5%, transparent 87%, var(--gold) 87.5%);
            background-size: 40px 70px;
            background-position: 0 0, 0 0, 20px 35px, 20px 35px;
            pointer-events: none;
        }

        /* ── Header ── */
        .header {
            text-align: center;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .crescent {
            font-size: 18px;
            color: var(--gold);
            margin-bottom: 2px;
        }

        .vakit-label {
            font-size: 22px;
            font-weight: 800;
            color: var(--gold);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .clock {
            display: flex;
            justify-content: center;
            align-items: baseline;
            gap: 3px;
            margin-bottom: 2px;
        }

        .clock-digit {
            font-size: 42px;
            font-weight: 800;
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        .clock-sep {
            font-size: 36px;
            font-weight: 300;
            color: var(--gold);
            animation: blink 1s ease-in-out infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.2;
            }
        }

        .date-text {
            font-size: 11px;
            color: var(--text-dim);
            letter-spacing: 1px;
        }

        /* ── Countdown bar ── */
        .countdown-bar {
            text-align: center;
            padding: 6px 0;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .countdown-bar .label {
            font-size: 11px;
            color: var(--text-dim);
            margin-bottom: 2px;
        }

        .countdown-bar .time {
            font-size: 18px;
            font-weight: 700;
            color: var(--gold-light);
            font-variant-numeric: tabular-nums;
        }

        /* ── City list ── */
        .city-list {
            position: relative;
            z-index: 1;
        }

        .page-wrapper {
            position: relative;
            min-height: 396px;
        }

        .page-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            opacity: 0;
            transform: translateX(30px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
        }

        .page-content.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        /* ── City row ── */
        .city-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            border: 1px solid rgba(212, 168, 67, 0.12);
            border-radius: 10px;
            padding: 6px 14px;
            transition: all 0.4s ease;
            animation: rowAppear 0.35s ease forwards;
            opacity: 0;
        }

        .city-row:nth-child(1) {
            animation-delay: 0.03s;
        }

        .city-row:nth-child(2) {
            animation-delay: 0.06s;
        }

        .city-row:nth-child(3) {
            animation-delay: 0.09s;
        }

        .city-row:nth-child(4) {
            animation-delay: 0.12s;
        }

        .city-row:nth-child(5) {
            animation-delay: 0.15s;
        }

        .city-row:nth-child(6) {
            animation-delay: 0.18s;
        }

        .city-row:nth-child(7) {
            animation-delay: 0.21s;
        }

        .city-row:nth-child(8) {
            animation-delay: 0.24s;
        }

        .city-row:nth-child(9) {
            animation-delay: 0.27s;
        }

        @keyframes rowAppear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Ezan okunan şehir — yanıp sönen altın */
        .city-row.called {
            background: var(--card-active);
            border-color: var(--gold);
            animation: ezanFlash 0.6s ease-in-out 5;
        }

        @keyframes ezanFlash {

            0%,
            100% {
                background: var(--card-active);
                box-shadow: 0 0 8px rgba(212, 168, 67, 0.3);
            }

            50% {
                background: rgba(212, 168, 67, 0.45);
                box-shadow: 0 0 18px rgba(212, 168, 67, 0.6);
            }
        }

        /* Kaybolma animasyonu */
        .city-row.fade-out {
            opacity: 0;
            transform: translateX(-40px) scale(0.95);
            transition: all 0.5s ease;
        }

        .rank {
            min-width: 26px;
            height: 26px;
            background: rgba(212, 168, 67, 0.15);
            border: 1px solid rgba(212, 168, 67, 0.3);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--gold);
        }

        .city-name {
            flex: 1;
            font-size: 17px;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .imsak-val {
            font-size: 18px;
            font-weight: 800;
            color: var(--gold-light);
            font-variant-numeric: tabular-nums;
            min-width: 55px;
            text-align: right;
        }

        .imsak-val.passed {
            color: var(--green-light);
            text-decoration: line-through;
            opacity: 0.5;
        }

        /* ── Footer ── */
        .footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            padding: 10px 0 2px;
            position: relative;
            z-index: 1;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(212, 168, 67, 0.2);
            transition: all 0.3s ease;
        }

        .dot.active {
            background: var(--gold);
            width: 18px;
            border-radius: 3px;
        }

        .page-label {
            font-size: 10px;
            color: var(--text-dim);
            margin-left: 8px;
            font-variant-numeric: tabular-nums;
        }

        .remaining-label {
            font-size: 10px;
            color: var(--gold);
            margin-left: auto;
        }
    </style>
</head>

<body>
    <div class="widget">
        <div class="geo-pattern"></div>

        <div class="header">
            <div class="crescent">☪</div>
            <div class="vakit-label" id="vakitLabel">İMSAK</div>
            <div class="clock">
                <span class="clock-digit" id="h">00</span>
                <span class="clock-sep">:</span>
                <span class="clock-digit" id="m">00</span>
                <span class="clock-sep">:</span>
                <span class="clock-digit" id="s">00</span>
            </div>
            <div class="date-text" id="dateText"></div>
        </div>

        <div class="countdown-bar">
            <div class="label" id="cdLabel">Sonraki ezan:</div>
            <div class="time" id="cdTime">--:--:--</div>
        </div>

        <div class="city-list">
            <div class="page-wrapper" id="pageWrapper"></div>
        </div>

        <div class="footer" id="footer"></div>
    </div>

    <script>
        // ═══════════════════════════════════════
        // ═══════════════════════════════════════
        //  CONFIG
        // ═══════════════════════════════════════
        const PER_PAGE = 9;
        const PAGE_INTERVAL = 8000;
        const FLASH_DURATION = 3000;

        const VAKIT_KEYS = ['imsak', 'ogle', 'ikindi', 'aksam', 'yatsi'];
        const VAKIT_LABELS = {
            imsak: 'İMSAK',
            ogle: 'ÖĞLE',
            ikindi: 'İKİNDİ',
            aksam: 'AKŞAM (İFTAR)',
            yatsi: 'YATSI'
        };

        // ═══════════════════════════════════════
        //  STATE
        // ═══════════════════════════════════════
        let DATA = [];
        let currentVakit = null;
        let activeDate = null;     // hangi günün verisini gösteriyoruz
        let sortedCities = [];
        let calledSet = new Set();
        let curPage = 0;
        let totalPages = 0;
        let switchPending = false;

        // ═══════════════════════════════════════
        //  HELPERS
        // ═══════════════════════════════════════
        function getDateKey(date) {
            var dd = String(date.getDate()).padStart(2, '0');
            var mm = String(date.getMonth() + 1).padStart(2, '0');
            var yyyy = date.getFullYear();
            return dd + '-' + mm + '-' + yyyy;
        }

        function parseTimeForDate(str, date) {
            // "05:56 (+03)" → Date objesi (belirtilen günde saat:dakika)
            if (!str) return null;
            var m = str.match(/^(\d{2}):(\d{2})/);
            if (!m) return null;
            var d = new Date(date);
            d.setHours(parseInt(m[1]), parseInt(m[2]), 0, 0);
            return d;
        }

        function findDay(cityData, dateKey) {
            for (var i = 0; i < cityData.gunler.length; i++) {
                if (cityData.gunler[i].tarih === dateKey) return cityData.gunler[i];
            }
            return null;
        }

        function countdownStr(ms) {
            if (ms <= 0) return '00:00:00';
            var s = Math.floor(ms / 1000);
            var h = Math.floor(s / 3600);
            s %= 3600;
            var m = Math.floor(s / 60);
            s %= 60;
            return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
        }

        function tomorrow() {
            var d = new Date();
            d.setDate(d.getDate() + 1);
            d.setHours(0, 0, 0, 0);
            return d;
        }

        // ═══════════════════════════════════════
        //  CLOCK
        // ═══════════════════════════════════════
        function tick() {
            var now = new Date();
            document.getElementById('h').textContent = String(now.getHours()).padStart(2, '0');
            document.getElementById('m').textContent = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('s').textContent = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('dateText').textContent =
                now.toLocaleDateString('tr-TR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            updateCountdown(now);
            checkEzan(now);
        }

        // ═══════════════════════════════════════
        //  DETERMINE CURRENT VAKIT
        // ═══════════════════════════════════════
        function determineVakit() {
            var now = new Date();
            var todayKey = getDateKey(now);

            // Her vakit için tüm şehirlerin o vakti geçip geçmediğine bak
            for (var vi = 0; vi < VAKIT_KEYS.length; vi++) {
                var vk = VAKIT_KEYS[vi];
                var hasAny = false;
                var allPassed = true;

                for (var ci = 0; ci < DATA.length; ci++) {
                    var gun = findDay(DATA[ci], todayKey);
                    if (!gun || !gun[vk]) continue;
                    hasAny = true;
                    var t = parseTimeForDate(gun[vk], now);
                    if (t && t > now) {
                        allPassed = false;
                        break;
                    }
                }

                if (hasAny && !allPassed) {
                    activeDate = new Date(now);
                    activeDate.setHours(0, 0, 0, 0);
                    return vk;
                }
            }

            // Tüm vakitler geçmiş → yarının imsakını göster
            activeDate = tomorrow();
            return 'imsak';
        }

        // ═══════════════════════════════════════
        //  SORT CITIES FOR CURRENT VAKIT
        // ═══════════════════════════════════════
        function sortCitiesForVakit(vk) {
            var dateKey = getDateKey(activeDate);
            var list = [];

            for (var i = 0; i < DATA.length; i++) {
                var gun = findDay(DATA[i], dateKey);
                if (!gun || !gun[vk]) continue;
                var t = parseTimeForDate(gun[vk], activeDate);
                if (!t) continue;
                list.push({
                    sehir: DATA[i].sehir,
                    saat: gun[vk].replace(/ \(\+03\)/, ''),
                    time: t,
                    idx: i
                });
            }

            list.sort(function (a, b) { return a.time - b.time; });
            return list;
        }

        // ═══════════════════════════════════════
        //  CHECK EZAN
        // ═══════════════════════════════════════
        function checkEzan(now) {
            if (!sortedCities.length) return;

            var changed = false;
            for (var i = 0; i < sortedCities.length; i++) {
                var c = sortedCities[i];
                if (calledSet.has(c.sehir)) continue;
                if (now >= c.time) {
                    calledSet.add(c.sehir);
                    changed = true;
                    flashCity(c.sehir);
                }
            }

            // Tüm şehirler okunduysa sonraki vakte geç
            var remaining = sortedCities.length - calledSet.size;
            if (remaining <= 0 && sortedCities.length > 0 && !switchPending) {
                switchPending = true;
                setTimeout(function () {
                    switchPending = false;
                    switchToNextVakit();
                }, FLASH_DURATION + 1500);
            }

            if (changed) {
                rebuildPages();
            }
        }

        function flashCity(sehirName) {
            var els = document.querySelectorAll('[data-sehir="' + sehirName + '"]');
            els.forEach(function (el) {
                el.classList.add('called');
                setTimeout(function () {
                    el.classList.add('fade-out');
                }, FLASH_DURATION);
            });
        }

        function switchToNextVakit() {
            var idx = VAKIT_KEYS.indexOf(currentVakit);
            if (idx < VAKIT_KEYS.length - 1) {
                currentVakit = VAKIT_KEYS[idx + 1];
                // Aynı gün, activeDate değişmez
            } else {
                // Yatsı bitti → yarının imsakına geç
                currentVakit = 'imsak';
                activeDate = tomorrow();
            }

            calledSet.clear();
            sortedCities = sortCitiesForVakit(currentVakit);
            document.getElementById('vakitLabel').textContent = VAKIT_LABELS[currentVakit] || currentVakit.toUpperCase();
            curPage = 0;
            rebuildPages();

            console.log('[Ezan] Vakit değişti → ' + currentVakit + ' (' + getDateKey(activeDate) + ') — ' + sortedCities.length + ' şehir');
        }

        // ═══════════════════════════════════════
        //  COUNTDOWN
        // ═══════════════════════════════════════
        function updateCountdown(now) {
            var nextTime = null;
            var nextCity = null;
            for (var i = 0; i < sortedCities.length; i++) {
                if (!calledSet.has(sortedCities[i].sehir) && sortedCities[i].time > now) {
                    nextTime = sortedCities[i].time;
                    nextCity = sortedCities[i].sehir;
                    break;
                }
            }

            var cdEl = document.getElementById('cdTime');
            var cdLbl = document.getElementById('cdLabel');
            if (nextTime) {
                var diff = nextTime - now;
                cdEl.textContent = countdownStr(diff);
                cdLbl.textContent = 'Sıradaki: ' + nextCity;
            } else if (sortedCities.length > 0 && calledSet.size < sortedCities.length) {
                // Henüz vakit gelmemiş, ilk sıradakine geri say
                var first = sortedCities[0];
                var diff = first.time - now;
                cdEl.textContent = countdownStr(diff);
                cdLbl.textContent = 'İlk ezan: ' + first.sehir;
            } else {
                cdEl.textContent = '--:--:--';
                cdLbl.textContent = 'Vakit geçişi bekleniyor...';
            }
        }

        // ═══════════════════════════════════════
        //  BUILD / REBUILD PAGES
        // ═══════════════════════════════════════
        function rebuildPages() {
            var visible = sortedCities.filter(function (c) {
                return !calledSet.has(c.sehir);
            });

            var displayList = visible;

            totalPages = Math.max(1, Math.ceil(displayList.length / PER_PAGE));
            if (curPage >= totalPages) curPage = 0;

            var wrapper = document.getElementById('pageWrapper');
            var footer = document.getElementById('footer');
            wrapper.innerHTML = '';
            footer.innerHTML = '';

            for (var p = 0; p < totalPages; p++) {
                var div = document.createElement('div');
                div.className = 'page-content' + (p === curPage ? ' active' : '');
                div.id = 'pg' + p;

                var slice = displayList.slice(p * PER_PAGE, p * PER_PAGE + PER_PAGE);
                for (var si = 0; si < slice.length; si++) {
                    var c = slice[si];
                    var row = document.createElement('div');
                    row.className = 'city-row';
                    row.setAttribute('data-sehir', c.sehir);

                    var globalIdx = sortedCities.indexOf(c) + 1;

                    row.innerHTML =
                        '<div class="rank">' + globalIdx + '</div>' +
                        '<div class="city-name">' + c.sehir + '</div>' +
                        '<div class="imsak-val">' + c.saat + '</div>';

                    div.appendChild(row);
                }
                wrapper.appendChild(div);

                var dot = document.createElement('div');
                dot.className = 'dot' + (p === curPage ? ' active' : '');
                dot.id = 'd' + p;
                footer.appendChild(dot);
            }

            var lbl = document.createElement('div');
            lbl.className = 'page-label';
            lbl.id = 'pgLbl';
            lbl.textContent = (curPage + 1) + ' / ' + totalPages;
            footer.appendChild(lbl);

            var rem = document.createElement('div');
            rem.className = 'remaining-label';
            rem.textContent = visible.length + ' şehir kaldı';
            footer.appendChild(rem);
        }

        function showPage(idx) {
            var prev = document.querySelector('.page-content.active');
            var prevDot = document.querySelector('.dot.active');
            if (prev) prev.classList.remove('active');
            if (prevDot) prevDot.classList.remove('active');

            var next = document.getElementById('pg' + idx);
            var nDot = document.getElementById('d' + idx);
            if (next) next.classList.add('active');
            if (nDot) nDot.classList.add('active');

            var pgLbl = document.getElementById('pgLbl');
            if (pgLbl) pgLbl.textContent = (idx + 1) + ' / ' + totalPages;
            curPage = idx;
        }

        function advance() {
            if (totalPages <= 1) return;
            showPage((curPage + 1) % totalPages);
        }

        // ═══════════════════════════════════════
        //  INIT
        // ═══════════════════════════════════════
        function init() {
            fetch('ramazan_imsakiye_2026.json')
                .then(function (r) { return r.json(); })
                .then(function (json) {
                    DATA = json;
                    console.log('[Ezan] JSON yüklendi, ' + DATA.length + ' şehir');

                    currentVakit = determineVakit();
                    sortedCities = sortCitiesForVakit(currentVakit);
                    document.getElementById('vakitLabel').textContent = VAKIT_LABELS[currentVakit];

                    console.log('[Ezan] Aktif vakit: ' + currentVakit + ' (' + getDateKey(activeDate) + ') — ' + sortedCities.length + ' şehir');

                    // Geçmiş vakitleri işaretle (sadece bugün ve şu andan önce olanlar)
                    var now = new Date();
                    for (var i = 0; i < sortedCities.length; i++) {
                        if (sortedCities[i].time <= now) {
                            calledSet.add(sortedCities[i].sehir);
                        }
                    }

                    rebuildPages();
                    setInterval(advance, PAGE_INTERVAL);
                    setInterval(tick, 1000);
                    tick();
                })
                .catch(function (e) {
                    console.error('[Ezan] JSON yüklenemedi:', e);
                });
        }

        init();
    </script>
</body>

</html>
