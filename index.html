<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İmsak Vakitleri - Ramazan</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Outfit:wght@300;400;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --gold: #d4a843;
            --gold-light: #f0d68a;
            --gold-glow: rgba(212, 168, 67, 0.45);
            --green-deep: #071a12;
            --green-dark: #0d2e20;
            --green-mid: #145a44;
            --text-primary: #f5f0e8;
            --text-secondary: #c4b99a;
            --card-bg: rgba(8, 30, 20, 0.85);
            --card-border: rgba(212, 168, 67, 0.25);
            --panel-bg: rgba(5, 18, 12, 0.88);
        }

        body {
            background: transparent;
            font-family: 'Outfit', sans-serif;
            color: var(--text-primary);
            overflow: hidden;
        }

        /* ── Main widget panel ── */
        .widget {
            width: 520px;
            background: var(--panel-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 22px 24px 18px;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 0 40px rgba(0, 0, 0, 0.6),
                0 0 80px rgba(5, 18, 12, 0.4),
                inset 0 1px 0 rgba(212, 168, 67, 0.1);
        }

        /* ── Subtle geometric pattern inside widget ── */
        .widget::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0.03;
            background-image:
                linear-gradient(30deg, var(--gold) 12%, transparent 12.5%, transparent 87%, var(--gold) 87.5%),
                linear-gradient(150deg, var(--gold) 12%, transparent 12.5%, transparent 87%, var(--gold) 87.5%),
                linear-gradient(30deg, var(--gold) 12%, transparent 12.5%, transparent 87%, var(--gold) 87.5%),
                linear-gradient(150deg, var(--gold) 12%, transparent 12.5%, transparent 87%, var(--gold) 87.5%),
                linear-gradient(60deg, rgba(212, 168, 67, 0.5) 25%, transparent 25.5%, transparent 75%, rgba(212, 168, 67, 0.5) 75%),
                linear-gradient(60deg, rgba(212, 168, 67, 0.5) 25%, transparent 25.5%, transparent 75%, rgba(212, 168, 67, 0.5) 75%);
            background-size: 60px 105px;
            background-position: 0 0, 0 0, 30px 52px, 30px 52px, 0 0, 30px 52px;
            pointer-events: none;
            z-index: 0;
        }

        /* Inner glow */
        .widget::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at top center, rgba(212, 168, 67, 0.06) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Header ── */
        .header {
            text-align: center;
            position: relative;
            z-index: 1;
            margin-bottom: 10px;
        }

        .header-ornament {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .ornament-line {
            width: 80px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .ornament-icon {
            font-size: 14px;
            color: var(--gold);
            text-shadow: 0 0 8px var(--gold-glow);
        }

        .title {
            font-family: 'Amiri', serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--gold);
            text-shadow: 0 0 20px var(--gold-glow);
            letter-spacing: 4px;
        }

        /* ── Clock ── */
        .clock-row {
            text-align: center;
            margin-bottom: 14px;
            position: relative;
            z-index: 1;
        }

        .clock {
            font-family: 'Outfit', sans-serif;
            font-size: 40px;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: 2px;
            line-height: 1;
            text-shadow: 0 0 20px rgba(245, 240, 232, 0.15);
        }

        .clock .sep {
            color: var(--gold);
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.25;
            }
        }

        .date-text {
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 1.5px;
            margin-top: 2px;
        }

        /* ── Divider ── */
        .divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(90deg, transparent 5%, var(--gold) 50%, transparent 95%);
            opacity: 0.25;
            margin-bottom: 14px;
            position: relative;
            z-index: 1;
        }

        /* ── City list ── */
        .city-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            z-index: 1;
        }

        .page-wrapper {
            position: relative;
            min-height: 396px;
        }

        .page-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
            opacity: 0;
            transform: translateX(30px);
            transition: opacity 0.5s ease, transform 0.5s ease;
            pointer-events: none;
        }

        .page-content.active {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }

        .page-content.exit-left {
            opacity: 0;
            transform: translateX(-30px);
        }

        /* ── City row ── */
        .city-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            border: 1px solid rgba(212, 168, 67, 0.12);
            border-radius: 10px;
            padding: 6px 14px;
            transition: all 0.3s ease;
            animation: rowAppear 0.35s ease forwards;
            opacity: 0;
        }

        .city-row:nth-child(1) {
            animation-delay: 0.03s;
        }

        .city-row:nth-child(2) {
            animation-delay: 0.06s;
        }

        .city-row:nth-child(3) {
            animation-delay: 0.09s;
        }

        .city-row:nth-child(4) {
            animation-delay: 0.12s;
        }

        .city-row:nth-child(5) {
            animation-delay: 0.15s;
        }

        .city-row:nth-child(6) {
            animation-delay: 0.18s;
        }

        .city-row:nth-child(7) {
            animation-delay: 0.21s;
        }

        .city-row:nth-child(8) {
            animation-delay: 0.24s;
        }

        .city-row:nth-child(9) {
            animation-delay: 0.27s;
        }

        @keyframes rowAppear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .plate {
            width: 38px;
            height: 30px;
            background: linear-gradient(135deg, var(--gold) 0%, #b8912e 100%);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 800;
            color: var(--green-deep);
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(212, 168, 67, 0.25);
        }

        .city-name {
            flex: 1;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .imsak-val {
            font-size: 20px;
            font-weight: 700;
            color: var(--gold-light);
            text-shadow: 0 0 12px var(--gold-glow);
            flex-shrink: 0;
            min-width: 55px;
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .imsak-val.loading {
            font-size: 12px;
            color: var(--text-secondary);
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 1;
            }
        }

        /* ── Footer / page indicator ── */
        .footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 12px;
            position: relative;
            z-index: 1;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(212, 168, 67, 0.18);
            border: 1px solid rgba(212, 168, 67, 0.25);
            transition: all 0.4s ease;
        }

        .dot.active {
            background: var(--gold);
            box-shadow: 0 0 10px var(--gold-glow);
            transform: scale(1.4);
        }

        .page-label {
            font-size: 11px;
            color: var(--text-secondary);
            letter-spacing: 1.5px;
            margin-left: 10px;
        }

        /* ── Decorative stars (inside widget) ── */
        .sparkle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--gold-light);
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
            z-index: 0;
        }

        .sparkle:nth-child(1) {
            top: 12px;
            right: 40px;
            animation-delay: 0s;
        }

        .sparkle:nth-child(2) {
            top: 8px;
            right: 80px;
            animation-delay: 0.7s;
            width: 3px;
            height: 3px;
        }

        .sparkle:nth-child(3) {
            top: 18px;
            right: 60px;
            animation-delay: 1.4s;
        }

        .sparkle:nth-child(4) {
            top: 6px;
            left: 50px;
            animation-delay: 2.1s;
            width: 2px;
            height: 2px;
        }

        .sparkle:nth-child(5) {
            bottom: 20px;
            left: 30px;
            animation-delay: 0.5s;
        }

        .sparkle:nth-child(6) {
            bottom: 14px;
            right: 50px;
            animation-delay: 1.8s;
            width: 3px;
            height: 3px;
        }

        @keyframes twinkle {

            0%,
            100% {
                opacity: 0.2;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.8);
            }
        }

        /* ── Crescent decoration ── */
        .crescent {
            position: absolute;
            top: 14px;
            right: 22px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            box-shadow: -5px -2px 0 0 var(--gold);
            opacity: 0.5;
            z-index: 1;
            animation: moonPulse 4s ease-in-out infinite;
        }

        @keyframes moonPulse {

            0%,
            100% {
                opacity: 0.4;
            }

            50% {
                opacity: 0.7;
            }
        }
    </style>
</head>

    <script>
        // ═══════════════════════════════════════

        // ═══════════════════════════════════════
        const API_KEY = '7ubDQjPHFIaqRVWiZFbixM:7jh7mKbZ5muvzXhXeQ2Aw9';
        const PER_PAGE = 9;
        const INTERVAL = 10000; // 10s
        const API_URL = 'https://api.collectapi.com/pray/single';

        // ═══════════════════════════════════════

        // ═══════════════════════════════════════
        const CITIES = [

            { p: '51', n: 'Niğde', q: 'niğde' },
            { p: '52', n: 'Ordu', q: 'ordu' },
            { p: '53', n: 'Rize', q: 'rize' },

            { p: '68', n: 'Aksaray', q: 'aksaray' },
            { p: '69', n: 'Bayburt', q: 'bayburt' },

            { p: '71', n: 'Kırıkkale', q: 'kırıkkale' },
            { p: '72', n: 'Batman', q: 'batman' },
            { p: '73', n: 'Şırnak', q: 'şırnak' },
            { p: '74', n: 'Bartın', q: 'bartın' },
            { p: '75', n: 'Ardahan', q: 'ardahan' },
            { p: '76', n: 'Iğdır', q: 'iğdır' },
            { p: '77', n: 'Yalova', q: 'yalova' },
            { p: '78', n: 'Karabük', q: 'karabük' },
            { p: '79', n: 'Kilis', q: 'kilis' },
            { p: '80', n: 'Osmaniye', q: 'osmaniye' },
            { p: '81', n: 'Düzce', q: 'düzce' }
        ];

        // ═══════════════════════════════════════
        //  STATE + LOCALSTORAGE CACHE
        // ═══════════════════════════════════════
        let curPage = 0;
        const totalPages = Math.ceil(CITIES.length / PER_PAGE);
        let firstLog = true;

        // Bugünün tarihi (YYYY-MM-DD) — günde 1 kez çekmek yeterli
        var TODAY = new Date().toISOString().slice(0, 10);
        var STORAGE_KEY = 'imsak_cache_' + TODAY;

        // localStorage'dan yükle veya boş obje
        function loadCache() {
            try {
                var raw = localStorage.getItem(STORAGE_KEY);
                if (raw) return JSON.parse(raw);
            } catch (e) { }
            return {};
        }
        function saveCache(cache) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(cache));
                // Eski günlerin verisini temizle
                for (var i = 0; i < localStorage.length; i++) {
                    var key = localStorage.key(i);
                    if (key && key.startsWith('imsak_cache_') && key !== STORAGE_KEY) {
                        localStorage.removeItem(key);
                    }
                }
            } catch (e) { }
        }

        var cache = loadCache();

        // ═══════════════════════════════════════
        //  CLOCK
        // ═══════════════════════════════════════
        function tick() {
            const now = new Date();
            document.getElementById('h').textContent = String(now.getHours()).padStart(2, '0');
            document.getElementById('m').textContent = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('s').textContent = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('dateText').textContent =
                now.toLocaleDateString('tr-TR', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        setInterval(tick, 1000);
        tick();

        // ═══════════════════════════════════════
        //  BUILD PAGES
        // ═══════════════════════════════════════
        function build() {
            const wrapper = document.getElementById('pageWrapper');
            const footer = document.getElementById('footer');
            wrapper.innerHTML = '';
            footer.innerHTML = '';

            for (let p = 0; p < totalPages; p++) {
                const div = document.createElement('div');
                div.className = 'page-content' + (p === 0 ? ' active' : '');
                div.id = `pg${p}`;

                const slice = CITIES.slice(p * PER_PAGE, p * PER_PAGE + PER_PAGE);
                slice.forEach(c => {
                    const row = document.createElement('div');
                    row.className = 'city-row';
                    // Eğer cache'de varsa direkt göster
                    var val = cache[c.q] || '···';
                    var cls = cache[c.q] ? 'imsak-val' : 'imsak-val loading';
                    row.innerHTML = `
                    <div class="plate">${c.p}</div>
                    <div class="city-name">${c.n}</div>
                    <div class="${cls}" id="t${c.p}">${val}</div>`;
                    div.appendChild(row);
                });
                wrapper.appendChild(div);

                const dot = document.createElement('div');
                dot.className = 'dot' + (p === 0 ? ' active' : '');
                dot.id = `d${p}`;
                footer.appendChild(dot);
            }

            const lbl = document.createElement('div');
            lbl.className = 'page-label';
            lbl.id = 'pgLbl';
            lbl.textContent = `1 / ${totalPages}`;
            footer.appendChild(lbl);
        }

        // ═══════════════════════════════════════
        //  API — sıralı istek (rate limit: 1/sn)
        // ═══════════════════════════════════════
        function fetchCity(city) {
            return new Promise(function (resolve) {
                if (cache[city.q]) {
                    setTime(city.p, cache[city.q]);
                    resolve();
                    return;
                }

                var xhr = new XMLHttpRequest();

                xhr.addEventListener('readystatechange', function () {
                    if (this.readyState === this.DONE) {
                        try {
                            var raw = this.responseText;
                            if (firstLog) {
                                console.log('[İmsak API] İlk yanıt (' + city.n + '):', raw);
                                firstLog = false;
                            }

                            var d = JSON.parse(raw);
                            if (d.success && d.ezan && d.ezan.time) {
                                cache[city.q] = d.ezan.time;
                                saveCache(cache); // her başarılı çekimde kaydet
                                setTime(city.p, d.ezan.time);
                            } else {
                                console.warn('[İmsak API] Beklenmeyen yanıt (' + city.n + '):', raw);
                                setTime(city.p, '—');
                            }
                        } catch (e) {
                            console.warn('[İmsak API] Hata (' + city.n + '):', this.status, this.responseText);
                            setTime(city.p, '—');
                        }
                        resolve();
                    }
                });

                var url = API_URL + '?ezan=' + encodeURIComponent('İmsak') + '&city=' + encodeURIComponent(city.q);
                xhr.open('GET', url);
                xhr.setRequestHeader('authorization', 'apikey ' + API_KEY);
                xhr.send(null);
            });
        }

        function setTime(plate, val) {
            var el = document.getElementById('t' + plate);
            if (el) { el.textContent = val; el.classList.remove('loading'); }
        }

        // Sadece cache'de olmayan şehirleri sırayla çek
        function fetchMissingCities() {
            var missing = CITIES.filter(function (c) { return !cache[c.q]; });
            if (missing.length === 0) {
                console.log('[İmsak] Tüm veriler localStorage cache\'den yüklendi ✓ (0 API çağrısı)');
                return;
            }
            console.log('[İmsak] ' + missing.length + ' şehir API\'den çekilecek, ' + (CITIES.length - missing.length) + ' şehir cache\'den yüklendi');
            var i = 0;
            function next() {
                if (i >= missing.length) {
                    console.log('[İmsak API] Tüm şehirler yüklendi ✓');
                    return;
                }
                fetchCity(missing[i]).then(function () {
                    i++;
                    setTimeout(next, 1200);
                });
            }
            next();
        }

        // ═══════════════════════════════════════
        //  PAGE CYCLING
        // ═══════════════════════════════════════
        function showPage(idx) {
            var prev = document.querySelector('.page-content.active');
            var prevDot = document.querySelector('.dot.active');
            if (prev) { prev.classList.remove('active'); prev.classList.add('exit-left'); }
            if (prevDot) prevDot.classList.remove('active');

            setTimeout(function () {
                if (prev) prev.classList.remove('exit-left');
                var next = document.getElementById('pg' + idx);
                var nDot = document.getElementById('d' + idx);
                if (next) next.classList.add('active');
                if (nDot) nDot.classList.add('active');
                document.getElementById('pgLbl').textContent = (idx + 1) + ' / ' + totalPages;
                curPage = idx;
            }, 500);
        }

        function advance() {
            showPage((curPage + 1) % totalPages);
        }

        // ═══════════════════════════════════════
        //  INIT
        // ═══════════════════════════════════════
        build();
        fetchMissingCities(); // sadece eksik şehirleri çek
        setInterval(advance, INTERVAL);
    </script>
</body>

</html>
